<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint Task Manager</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f8f8f7;--bg3:#f2f1f0;
  --border:#e5e4e2;--border2:#d4d3d1;
  --text:#1a1a18;--text2:#6b6a67;--text3:#a8a7a4;
  --radius:8px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);padding:1.5rem;max-width:900px;margin:0 auto}
h1{font-size:18px;font-weight:600;margin-bottom:1.25rem;color:var(--text)}
.tabs{display:flex;gap:2px;margin-bottom:1.5rem;border-bottom:1px solid var(--border)}
.tab{padding:8px 18px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;font-family:var(--font)}
.tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:500}
.section{display:none}.section.visible{display:block}
.period-nav{display:flex;align-items:center;gap:8px;margin-bottom:1rem}
.nav-btn{background:none;border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;cursor:pointer;color:var(--text2);font-size:13px;display:flex;align-items:center;gap:4px;font-family:var(--font)}
.nav-btn:hover{background:var(--bg2)}
.period-label{font-size:15px;font-weight:500;color:var(--text);min-width:220px;text-align:center}
.badge{font-size:10px;padding:2px 7px;border-radius:99px;margin-left:6px;font-weight:500;display:inline-block;vertical-align:middle}
.badge-purple{background:#eeedfe;color:#3c3489}
.badge-green{background:#eaf3de;color:#275010}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.stat{background:var(--bg2);border-radius:var(--radius);padding:10px 14px;text-align:center;border:1px solid var(--border)}
.stat-n{font-size:22px;font-weight:600}
.stat-l{font-size:11px;color:var(--text2);margin-top:2px}
.add-row{display:flex;gap:8px;margin-bottom:1rem}
.add-row input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:13px;font-family:var(--font);outline:none}
.add-row input:focus{border-color:var(--border2)}
.add-row input::placeholder{color:var(--text3)}
.add-btn{padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:13px;cursor:pointer;font-family:var(--font);white-space:nowrap;display:flex;align-items:center;gap:4px}
.add-btn:hover{background:var(--bg2)}
.week-group{margin-bottom:1.25rem}
.week-group-header{font-size:11px;font-weight:500;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.wline{flex:1;height:1px;background:var(--border)}
.task-list{display:flex;flex-direction:column;gap:5px}
.task-item{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);transition:border-color .15s}
.task-item:hover{border-color:var(--border2)}
.task-item.done{background:var(--bg2)}
.status-select{padding:3px 7px;border:1px solid var(--border);border-radius:99px;font-size:11px;font-family:var(--font);cursor:pointer;outline:none;min-width:112px}
.s-done{background:#eaf3de;color:#275010;border-color:#97c459}
.s-not{background:#fcebeb;color:#791f1f;border-color:#f09595}
.s-prog{background:#e6f1fb;color:#0c447c;border-color:#85b7eb}
.task-text{flex:1;font-size:13px;line-height:1.4}
.task-text.done{color:var(--text2);text-decoration:line-through}
.assignee-pill{font-size:11px;padding:2px 8px;border-radius:99px;white-space:nowrap;font-weight:500}
.av-Y{background:#e6f1fb;color:#0c447c}
.av-C{background:#e1f5ee;color:#085041}
.av-U{background:#faece7;color:#712b13}
.av-X{background:#f1efe8;color:#444441}
.del-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:15px;padding:2px 4px;display:flex;align-items:center;flex-shrink:0}
.del-btn:hover{color:#e24b4a}
.empty{text-align:center;padding:2.5rem;color:var(--text3);font-size:14px}
.person-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.pf-btn{padding:4px 12px;border:1px solid var(--border);border-radius:99px;font-size:12px;cursor:pointer;background:var(--bg);color:var(--text2);font-family:var(--font)}
.pf-btn:hover{background:var(--bg2)}
.pf-btn.active{background:var(--bg3);color:var(--text);border-color:var(--border2);font-weight:500}
.date-picker-wrap{position:relative;display:inline-block}
.date-picker-btn{display:flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text2);font-size:13px;cursor:pointer;font-family:var(--font)}
.date-picker-btn:hover{background:var(--bg2)}
.date-picker-dropdown{display:none;position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:100;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius);box-shadow:0 4px 16px rgba(0,0,0,.1);padding:14px;min-width:280px}
.date-picker-dropdown.open{display:block}
.dp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dp-month-label{font-size:13px;font-weight:600;color:var(--text)}
.dp-nav{background:none;border:none;cursor:pointer;color:var(--text2);font-size:16px;padding:2px 6px;border-radius:4px;display:flex;align-items:center}
.dp-nav:hover{background:var(--bg2)}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-day-name{font-size:10px;font-weight:500;color:var(--text3);text-align:center;padding:3px 0}
.dp-day{font-size:12px;text-align:center;padding:5px 3px;border-radius:4px;cursor:pointer;color:var(--text2);border:1px solid transparent}
.dp-day:hover{background:var(--bg2);color:var(--text)}
.dp-day.sprint-start{background:#eeedfe;color:#3c3489;font-weight:600;border-color:#c4c0f5}
.dp-day.in-sprint{background:#f5f4ff;color:#3c3489}
.dp-day.selected-sprint .sprint-start{background:#3c3489;color:#fff}
.dp-day.today{font-weight:700;color:var(--text)}
.dp-day.other-month{color:var(--text3);opacity:.4}
.dp-day.disabled{opacity:.3;cursor:default;pointer-events:none}
.dp-sprint-list{margin-top:10px;border-top:1px solid var(--border);padding-top:10px;max-height:140px;overflow-y:auto}
.dp-sprint-item{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:12px;color:var(--text2)}
.dp-sprint-item:hover{background:var(--bg2);color:var(--text)}
.dp-sprint-item.active{background:#eeedfe;color:#3c3489;font-weight:500}
.dp-sprint-tag{font-size:10px;padding:1px 6px;border-radius:99px;background:#eeedfe;color:#3c3489;margin-left:6px}
.dp-sprint-item.active .dp-sprint-tag{background:#3c3489;color:#fff}
.reminder-banner{display:none;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:var(--radius);margin-bottom:1.25rem;border:1px solid #f09595;background:#fff5f5}
.reminder-banner.show{display:flex}
.reminder-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.reminder-body{flex:1}
.reminder-title{font-size:13px;font-weight:600;color:#791f1f;margin-bottom:4px}
.reminder-list{list-style:none;padding:0;margin:0 0 8px}
.reminder-list li{font-size:12px;color:#791f1f;padding:2px 0;display:flex;align-items:center;gap:6px}
.reminder-list li::before{content:'🚩';font-size:11px}
.reminder-meta{font-size:11px;color:#a85a5a}
.reminder-close{background:none;border:none;cursor:pointer;color:#a85a5a;font-size:18px;flex-shrink:0;padding:0;line-height:1;display:flex;align-items:center}
.reminder-close:hover{color:#791f1f}
</style>
</head>
<body>
<h1><i class="ti ti-checklist" style="margin-right:6px"></i>Sprint Task Manager</h1>

<div class="reminder-banner" id="reminder-banner">
  <span class="reminder-icon">🔔</span>
  <div class="reminder-body">
    <div class="reminder-title" id="reminder-title"></div>
    <ul class="reminder-list" id="reminder-list"></ul>
    <div class="reminder-meta" id="reminder-meta"></div>
  </div>
  <button class="reminder-close" onclick="dismissReminder()" title="Dismiss">×</button>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('weekly')"><i class="ti ti-calendar-week"></i> Weekly</button>
  <button class="tab" onclick="switchTab('monthly')"><i class="ti ti-calendar-month"></i> Monthly</button>
  <button class="tab" onclick="switchTab('goals')"><i class="ti ti-target"></i> Monthly Goals</button>
</div>

<div id="weekly" class="section visible">
  <div class="period-nav">
    <button class="nav-btn" onclick="changeWeek(-1)"><i class="ti ti-arrow-left"></i></button>
    <div class="date-picker-wrap">
      <button class="date-picker-btn" onclick="togglePicker()" id="dp-trigger">
        <i class="ti ti-calendar"></i>
        <span id="week-label" style="min-width:200px;text-align:center"></span>
        <i class="ti ti-chevron-down" style="font-size:12px"></i>
      </button>
      <div class="date-picker-dropdown" id="dp-dropdown">
        <div class="dp-header">
          <button class="dp-nav" onclick="dpChangeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
          <span class="dp-month-label" id="dp-month-label"></span>
          <button class="dp-nav" onclick="dpChangeMonth(1)"><i class="ti ti-chevron-right"></i></button>
        </div>
        <div class="dp-grid" id="dp-grid"></div>
        <div class="dp-sprint-list" id="dp-sprint-list"></div>
      </div>
    </div>
    <button class="nav-btn" onclick="changeWeek(1)"><i class="ti ti-arrow-right"></i></button>
  </div>
  <div style="margin-bottom:1rem">
    <select id="sprint-jump" onchange="curWeek=this.value;render()" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:13px;font-family:var(--font);cursor:pointer"></select>
  </div>
  <div class="stats" id="week-stats"></div>
  <div class="add-row">
    <input id="w-input" placeholder="Add a task for this sprint…" onkeydown="if(event.key==='Enter')addTask()">
    <input id="w-assignee" placeholder="Assignee" style="max-width:110px" onkeydown="if(event.key==='Enter')addTask()">
    <button class="add-btn" onclick="addTask()"><i class="ti ti-plus"></i> Add</button>
  </div>
  <div id="weekly-tasks"></div>
</div>

<div id="monthly" class="section">
  <div class="period-nav">
    <button class="nav-btn" onclick="changeMonth(-1)"><i class="ti ti-arrow-left"></i></button>
    <span class="period-label" id="month-label"></span>
    <button class="nav-btn" onclick="changeMonth(1)"><i class="ti ti-arrow-right"></i></button>
  </div>
  <div class="stats" id="month-stats"></div>
  <div class="person-filter" id="person-filter"></div>
  <div id="monthly-tasks"></div>
</div>

<div id="goals" class="section">
  <div class="period-nav">
    <button class="nav-btn" onclick="changeGoalMonth(-1)"><i class="ti ti-arrow-left"></i></button>
    <span class="period-label" id="goal-month-label"></span>
    <button class="nav-btn" onclick="changeGoalMonth(1)"><i class="ti ti-arrow-right"></i></button>
  </div>
  <div class="stats" id="goal-stats"></div>
  <div class="person-filter" id="goal-person-filter"></div>
  <div class="add-row">
    <input id="g-input" placeholder="Add a monthly goal…" onkeydown="if(event.key==='Enter')addGoal()">
    <input id="g-assignee" placeholder="Assignee" style="max-width:110px" onkeydown="if(event.key==='Enter')addGoal()">
    <button class="add-btn" onclick="addGoal()"><i class="ti ti-plus"></i> Add</button>
  </div>
  <div id="goal-tasks"></div>
</div>

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sprintKey(date){
  const d=new Date(date+'T00:00:00');
  const diff=d.getDay()>=2?d.getDay()-2:d.getDay()+5;
  d.setDate(d.getDate()-diff); d.setHours(0,0,0,0);
  return d.toISOString().slice(0,10);
}
function sprintLabel(key){
  const s=new Date(key+'T00:00:00'), e=new Date(key+'T00:00:00');
  e.setDate(e.getDate()+6);
  const f=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  return f(s)+' – '+f(e);
}
function monthKey(date){ const d=new Date(date+'T00:00:00'); return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0'); }
function monthLabel(key){ const [y,m]=key.split('-'); return new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}); }
function shiftWeek(key,d){ const dt=new Date(key+'T00:00:00'); dt.setDate(dt.getDate()+d*7); return sprintKey(dt.toISOString().slice(0,10)); }
function shiftMonth(key,d){ const [y,m]=key.split('-').map(Number); const dt=new Date(y,m-1+d,1); return dt.getFullYear()+'-'+(dt.getMonth()+1).toString().padStart(2,'0'); }
function weekTagFor(key){ return Object.entries(WEEK_DATES).find(([,v])=>v===key)?.[0]||null; }
function scls(s){ return s==='done'?'s-done':s==='in progress'?'s-prog':'s-not'; }
function acls(p){ return p==='Yasin'?'av-Y':p==='Cemil'?'av-C':p==='Ugur'?'av-U':'av-X'; }

// ---- data ----
// W29 is the current sprint — everything before it is done
const CURRENT_SPRINT_KEY = '2025-08-12';
function defaultStatus(sprintKey){ return sprintKey < '2025-08-12' ? 'done' : 'not completed'; }
function defaultGoalStatus(mk){
  if(mk <= '2026-07') return 'done';
  return 'not completed';
}

function buildFresh(){
  const list=[];
  SLACK.forEach((entry,ei)=>{
    const sk=WEEK_DATES[entry.w]; const mk=monthKey(sk);
    entry.t.forEach((text,i)=>{
      list.push({id:uid()+ei+i,text,assignee:entry.p,status:defaultStatus(sk),sprintKey:sk,monthKey:mk,weekLabel:entry.w,created:new Date(sk+'T00:00:00').getTime()+i*1000});
    });
  });
  return list;
}

const DATA_VERSION='spm_v9';
let tasks=[];
try{ tasks=JSON.parse(localStorage.getItem(DATA_VERSION)||'null'); }catch(e){}
if(!tasks||!tasks.length){ tasks=buildFresh(); }

// merge in any missing tasks without losing existing statuses
const existingKeys=new Set(tasks.map(t=>t.weekLabel+'||'+t.text));
SLACK.forEach((entry,ei)=>{
  const sk=WEEK_DATES[entry.w]; const mk=monthKey(sk);
  entry.t.forEach((text,i)=>{
    const key=entry.w+'||'+text;
    if(!existingKeys.has(key)){
      tasks.push({id:uid()+ei+i,text,assignee:entry.p,status:defaultStatus(sk),sprintKey:sk,monthKey:mk,weekLabel:entry.w,created:new Date(sk+'T00:00:00').getTime()+i*1000});
      existingKeys.add(key);
    }
  });
});

function save(){ try{ localStorage.setItem(DATA_VERSION,JSON.stringify(tasks)); }catch(e){} }
save();

// ---- state ----
const CURRENT_SPRINT = CURRENT_SPRINT_KEY;
let curWeek = CURRENT_SPRINT;
let curMonth = monthKey(CURRENT_SPRINT);
let activeFilter = 'all';
let activeTab = 'weekly';

// ---- actions ----
function addTask(){
  const inp=document.getElementById('w-input');
  const aInp=document.getElementById('w-assignee');
  const text=inp.value.trim(); if(!text) return;
  const sk=curWeek; const mk=monthKey(sk);
  tasks.push({id:uid(),text,assignee:aInp.value.trim(),status:'not completed',sprintKey:sk,monthKey:mk,created:Date.now()});
  save(); inp.value=''; aInp.value=''; render();
}
function delTask(id){ tasks=tasks.filter(t=>t.id!==id); save(); render(); }
function setStatus(id,s){ const t=tasks.find(t=>t.id===id); if(t){t.status=s;save();render();} }

// ---- render ----
function makeTaskEl(t){
  const div=document.createElement('div');
  div.className='task-item'+(t.status==='done'?' done':'');
  div.innerHTML=`
    ${t.status==='not completed'?'<i class="ti ti-flag-filled" style="color:#e24b4a;font-size:15px;flex-shrink:0" title="Not completed"></i>':''}
    <select class="status-select ${scls(t.status)}" onchange="setStatus('${t.id}',this.value)">
      ${STATUSES.map(s=>`<option value="${s}"${t.status===s?' selected':''}>${s}</option>`).join('')}
    </select>
    <span class="task-text${t.status==='done'?' done':''}">${esc(t.text)}</span>
    ${t.assignee?`<span class="assignee-pill ${acls(t.assignee)}">${esc(t.assignee)}</span>`:''}
    <button class="del-btn" onclick="delTask('${t.id}')" title="Delete"><i class="ti ti-trash"></i></button>
  `;
  return div;
}

function statsHtml(list){
  const total=list.length, done=list.filter(t=>t.status==='done').length, notc=list.filter(t=>t.status==='not completed').length;
  return `
    <div class="stat"><div class="stat-n">${total}</div><div class="stat-l">total</div></div>
    <div class="stat"><div class="stat-n" style="color:#275010">${done}</div><div class="stat-l">done</div></div>
    <div class="stat"><div class="stat-n" style="color:#791f1f">${notc}</div><div class="stat-l">not completed</div></div>
  `;
}

function sortTasks(list){
  const o={'not completed':0,'in progress':1,'done':2};
  return [...list].sort((a,b)=>o[a.status]-o[b.status]||a.created-b.created);
}

function renderWeekly(){
  const wTag=weekTagFor(curWeek);
  const isCurrent=curWeek===CURRENT_SPRINT;
  document.getElementById('week-label').innerHTML=
    sprintLabel(curWeek)+
    (wTag?`<span class="badge badge-purple">${wTag}</span>`:'')+
    (isCurrent?`<span class="badge badge-green">current</span>`:'');

  // populate sprint jump select
  const sel = document.getElementById('sprint-jump');
  if(sel){
    const knownSprints=[...new Set([...Object.values(WEEK_DATES),...tasks.map(t=>t.sprintKey).filter(Boolean)])].sort().reverse();
    sel.innerHTML = knownSprints.map(sk=>{
      const tag=weekTagFor(sk)||'';
      const count=tasks.filter(t=>t.sprintKey===sk).length;
      return `<option value="${sk}"${sk===curWeek?' selected':''}>${tag?tag+' · ':''}${sprintLabel(sk)} (${count})</option>`;
    }).join('');
  }

  const list=tasks.filter(t=>t.sprintKey===curWeek);
  document.getElementById('week-stats').innerHTML=statsHtml(list);

  const container=document.getElementById('weekly-tasks');
  container.innerHTML='';
  if(!list.length){ container.innerHTML='<div class="empty">No tasks for this sprint.</div>'; return; }

  const byPerson={};
  list.forEach(t=>{ const p=t.assignee||'–'; if(!byPerson[p]) byPerson[p]=[]; byPerson[p].push(t); });
  const ORDER=['Yasin','Cemil','Ugur'];
  [...ORDER.filter(p=>byPerson[p]),...Object.keys(byPerson).filter(p=>!ORDER.includes(p))].forEach(person=>{
    const grp=document.createElement('div'); grp.className='week-group';
    const hdr=document.createElement('div'); hdr.className='week-group-header';
    hdr.innerHTML=`<span class="assignee-pill ${acls(person)}" style="font-size:11px">${esc(person)}</span><span class="wline"></span>`;
    grp.appendChild(hdr);
    const tl=document.createElement('div'); tl.className='task-list';
    sortTasks(byPerson[person]).forEach(t=>tl.appendChild(makeTaskEl(t)));
    grp.appendChild(tl); container.appendChild(grp);
  });
}

function renderMonthly(){
  document.getElementById('month-label').textContent=monthLabel(curMonth);
  const mt=tasks.filter(t=>t.monthKey===curMonth);
  const assignees=[...new Set(mt.map(t=>t.assignee||'').filter(Boolean))];
  const ORDER=['Yasin','Cemil','Ugur'];

  const pf=document.getElementById('person-filter'); pf.innerHTML='';
  ['all',...ORDER.filter(a=>assignees.includes(a)),...assignees.filter(a=>!ORDER.includes(a))].forEach(a=>{
    const b=document.createElement('button');
    b.className='pf-btn'+(activeFilter===a?' active':'');
    b.textContent=a==='all'?'All':a;
    b.onclick=()=>{ activeFilter=a; renderMonthly(); };
    pf.appendChild(b);
  });

  const filtered=activeFilter==='all'?mt:mt.filter(t=>t.assignee===activeFilter);
  document.getElementById('month-stats').innerHTML=statsHtml(filtered);

  const container=document.getElementById('monthly-tasks'); container.innerHTML='';
  if(!filtered.length){ container.innerHTML='<div class="empty">No tasks for this month.</div>'; return; }

  const byWeek={};
  filtered.forEach(t=>{ const wk=t.sprintKey; if(!byWeek[wk]) byWeek[wk]=[]; byWeek[wk].push(t); });
  Object.keys(byWeek).sort().forEach(wk=>{
    const tag=weekTagFor(wk);
    const grp=document.createElement('div'); grp.className='week-group';
    const hdr=document.createElement('div'); hdr.className='week-group-header';
    hdr.innerHTML=`<span style="white-space:nowrap">${tag?`<strong>${tag}</strong> · `:''} ${sprintLabel(wk)}</span><span class="wline"></span>`;
    grp.appendChild(hdr);
    const tl=document.createElement('div'); tl.className='task-list';
    sortTasks(byWeek[wk]).forEach(t=>tl.appendChild(makeTaskEl(t)));
    grp.appendChild(tl); container.appendChild(grp);
  });
}

function render(){ renderWeekly(); renderMonthly(); }

// ---- monthly goals state & data ----
const GOAL_KEY = 'spm_goals_v6';
let goals = [];
try { goals = JSON.parse(localStorage.getItem(GOAL_KEY)||'null'); } catch(e) {}
if(!goals||!goals.length) goals = [];

// seed from MONTHLY_GOALS without overwriting existing
const existingGoalKeys = new Set(goals.map(g=>g.monthKey+'||'+g.assignee+'||'+g.text));
MONTHLY_GOALS.forEach((entry,ei)=>{
  entry.t.forEach((text,i)=>{
    const key = entry.m+'||'+entry.p+'||'+text;
    if(!existingGoalKeys.has(key)){
      goals.push({id:uid()+'g'+ei+i, text, assignee:entry.p, status:defaultGoalStatus(entry.m), monthKey:entry.m, created:new Date(entry.m+'-01T00:00:00').getTime()+i*1000});
      existingGoalKeys.add(key);
    }
  });
});
function saveGoals(){ try{ localStorage.setItem(GOAL_KEY, JSON.stringify(goals)); }catch(e){} }
saveGoals();

let curGoalMonth = '2026-07';
let activeGoalFilter = 'all';

function addGoal(){
  const inp=document.getElementById('g-input');
  const aInp=document.getElementById('g-assignee');
  const text=inp.value.trim(); if(!text) return;
  goals.push({id:uid(),text,assignee:aInp.value.trim(),status:'not completed',monthKey:curGoalMonth,created:Date.now()});
  saveGoals(); inp.value=''; aInp.value=''; renderGoals();
}
function delGoal(id){ goals=goals.filter(g=>g.id!==id); saveGoals(); renderGoals(); }
function setGoalStatus(id,s){ const g=goals.find(g=>g.id===id); if(g){g.status=s;saveGoals();renderGoals();} }

function makeGoalEl(g){
  const div=document.createElement('div');
  div.className='task-item'+(g.status==='done'?' done':'');
  div.innerHTML=`
    ${g.status==='not completed'?'<i class="ti ti-flag-filled" style="color:#e24b4a;font-size:15px;flex-shrink:0" title="Not completed"></i>':''}
    <select class="status-select ${scls(g.status)}" onchange="setGoalStatus('${g.id}',this.value)">
      ${STATUSES.map(s=>`<option value="${s}"${g.status===s?' selected':''}>${s}</option>`).join('')}
    </select>
    <span class="task-text${g.status==='done'?' done':''}">${esc(g.text)}</span>
    ${g.assignee?`<span class="assignee-pill ${acls(g.assignee)}">${esc(g.assignee)}</span>`:''}
    <button class="del-btn" onclick="delGoal('${g.id}')" title="Delete"><i class="ti ti-trash"></i></button>
  `;
  return div;
}

function renderGoals(){
  document.getElementById('goal-month-label').textContent = monthLabel(curGoalMonth);
  const mg = goals.filter(g=>g.monthKey===curGoalMonth);
  const assignees = [...new Set(mg.map(g=>g.assignee||'').filter(Boolean))];
  const ORDER = ['Yasin','Cemil','Ugur'];

  const pf = document.getElementById('goal-person-filter'); pf.innerHTML='';
  ['all',...ORDER.filter(a=>assignees.includes(a)),...assignees.filter(a=>!ORDER.includes(a))].forEach(a=>{
    const b=document.createElement('button');
    b.className='pf-btn'+(activeGoalFilter===a?' active':'');
    b.textContent=a==='all'?'All':a;
    b.onclick=()=>{ activeGoalFilter=a; renderGoals(); };
    pf.appendChild(b);
  });

  const filtered = activeGoalFilter==='all' ? mg : mg.filter(g=>g.assignee===activeGoalFilter);
  const total=filtered.length, done=filtered.filter(g=>g.status==='done').length, notc=filtered.filter(g=>g.status==='not completed').length;
  document.getElementById('goal-stats').innerHTML=`
    <div class="stat"><div class="stat-n">${total}</div><div class="stat-l">total</div></div>
    <div class="stat"><div class="stat-n" style="color:#275010">${done}</div><div class="stat-l">done</div></div>
    <div class="stat"><div class="stat-n" style="color:#791f1f">${notc}</div><div class="stat-l">not completed</div></div>
  `;

  const container = document.getElementById('goal-tasks'); container.innerHTML='';
  if(!filtered.length){ container.innerHTML='<div class="empty">No goals for this month.</div>'; return; }

  const byPerson={};
  filtered.forEach(g=>{ const p=g.assignee||'–'; if(!byPerson[p]) byPerson[p]=[]; byPerson[p].push(g); });
  [...ORDER.filter(p=>byPerson[p]),...Object.keys(byPerson).filter(p=>!ORDER.includes(p))].forEach(person=>{
    const grp=document.createElement('div'); grp.className='week-group';
    const hdr=document.createElement('div'); hdr.className='week-group-header';
    hdr.innerHTML=`<span class="assignee-pill ${acls(person)}" style="font-size:11px">${esc(person)}</span><span class="wline"></span>`;
    grp.appendChild(hdr);
    const tl=document.createElement('div'); tl.className='task-list';
    sortTasks(byPerson[person]).forEach(g=>tl.appendChild(makeGoalEl(g)));
    grp.appendChild(tl); container.appendChild(grp);
  });
}

function changeGoalMonth(d){ curGoalMonth=shiftMonth(curGoalMonth,d); renderGoals(); }

function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',['weekly','monthly','goals'][i]===tab));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('visible'));
  document.getElementById(tab).classList.add('visible');
  if(tab==='goals') renderGoals();
}

function changeWeek(d){
  // get all sprint keys that have tasks, sorted
  const knownSprints = [...new Set([
    ...Object.values(WEEK_DATES),
    ...tasks.map(t=>t.sprintKey).filter(Boolean)
  ])].sort();

  const idx = knownSprints.indexOf(curWeek);
  if(idx === -1){
    // not in list, find nearest
    const newIdx = d > 0
      ? knownSprints.findIndex(k=>k>curWeek)
      : knownSprints.slice().reverse().findIndex(k=>k<curWeek);
    curWeek = knownSprints[Math.max(0, Math.min(newIdx, knownSprints.length-1))] || curWeek;
  } else {
    const newIdx = Math.max(0, Math.min(idx+d, knownSprints.length-1));
    curWeek = knownSprints[newIdx];
  }
  render();
}
function changeMonth(d){ curMonth=shiftMonth(curMonth,d); renderMonthly(); }

// ---- date picker ----
let dpViewMonth = new Date(CURRENT_SPRINT+'T00:00:00');
dpViewMonth.setDate(1);

function togglePicker(){
  const dd=document.getElementById('dp-dropdown');
  dd.classList.toggle('open');
  if(dd.classList.contains('open')){ dpViewMonth=new Date(curWeek+'T00:00:00'); dpViewMonth.setDate(1); renderPicker(); }
}

function closePicker(){ document.getElementById('dp-dropdown').classList.remove('open'); }

document.addEventListener('click', e=>{
  const wrap=document.querySelector('.date-picker-wrap');
  if(wrap && !wrap.contains(e.target)) closePicker();
});

function dpChangeMonth(d){
  dpViewMonth=new Date(dpViewMonth.getFullYear(), dpViewMonth.getMonth()+d, 1);
  renderPicker();
}

function allSprintKeys(){
  const keys=new Set([...Object.values(WEEK_DATES),...tasks.map(t=>t.sprintKey).filter(Boolean)]);
  return [...keys].sort();
}

function renderPicker(){
  const year=dpViewMonth.getFullYear(), month=dpViewMonth.getMonth();
  document.getElementById('dp-month-label').textContent=
    new Date(year,month,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});

  const grid=document.getElementById('dp-grid');
  grid.innerHTML='';
  ['Tu','We','Th','Fr','Sa','Su','Mo'].forEach(d=>{
    const el=document.createElement('div'); el.className='dp-day-name'; el.textContent=d; grid.appendChild(el);
  });

  const firstDay=new Date(year,month,1);
  const fdow=firstDay.getDay();
  const offset=(fdow>=2)?fdow-2:fdow+5;
  const gridStart=new Date(firstDay); gridStart.setDate(1-offset);

  const sprintSet=new Set(allSprintKeys());
  const todayStr=new Date().toISOString().slice(0,10);

  for(let i=0;i<42;i++){
    const d=new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const dStr=d.toISOString().slice(0,10);
    const sk=sprintKey(dStr);
    const isSprintStart=sprintSet.has(dStr);
    const inCurSprint=sk===curWeek;
    const isToday=dStr===todayStr;
    const otherMonth=d.getMonth()!==month;

    const el=document.createElement('div');
    el.className='dp-day'+(isToday?' today':'')+(otherMonth?' other-month':'');
    if(inCurSprint && isSprintStart){ el.style.cssText='background:#3c3489;color:#fff;font-weight:700;border-radius:4px'; }
    else if(inCurSprint){ el.style.cssText='background:#f0efff;color:#3c3489;border-radius:4px'; }
    else if(isSprintStart){ el.style.cssText='background:#eeedfe;color:#3c3489;font-weight:600;border-radius:4px;border:1px solid #c4c0f5'; }
    el.textContent=d.getDate();
    el.title=isSprintStart?'Sprint: '+sprintLabel(dStr):(inCurSprint?'In sprint: '+sprintLabel(sk):'');
    el.onclick=()=>{ curWeek=sk; closePicker(); render(); };
    grid.appendChild(el);
  }

  const list=document.getElementById('dp-sprint-list');
  list.innerHTML='<div style="font-size:10px;font-weight:500;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Sprints this month</div>';

  const seen=new Set();
  const monthSprints=[];
  for(let d=new Date(year,month-1,25);d<=new Date(year,month+1,7);d.setDate(d.getDate()+1)){
    const sk=sprintKey(d.toISOString().slice(0,10));
    if(!seen.has(sk)){
      seen.add(sk);
      const start=new Date(sk+'T00:00:00'), end=new Date(sk+'T00:00:00'); end.setDate(end.getDate()+6);
      if(start.getMonth()===month||end.getMonth()===month) monthSprints.push(sk);
    }
  }

  if(!monthSprints.length){ list.innerHTML+='<div style="color:var(--text3);font-size:12px">No sprints</div>'; return; }
  monthSprints.sort().forEach(sk=>{
    const tag=weekTagFor(sk);
    const taskCount=tasks.filter(t=>t.sprintKey===sk).length;
    const item=document.createElement('div');
    item.className='dp-sprint-item'+(sk===curWeek?' active':'');
    item.innerHTML=`<span>${sprintLabel(sk)}${tag?`<span class="dp-sprint-tag">${tag}</span>`:''}</span>
      <span style="font-size:11px;color:var(--text3)">${taskCount} tasks</span>`;
    item.onclick=()=>{ curWeek=sk; closePicker(); render(); };
    list.appendChild(item);
  });
}

// ---- end-of-sprint reminder ----
function getSprintEndDate(sk){
  const d=new Date(sk+'T00:00:00'); d.setDate(d.getDate()+6); return d;
}
function daysUntilSprintEnd(sk){
  const end=getSprintEndDate(sk); end.setHours(23,59,59,999);
  return Math.ceil((end-new Date())/(1000*60*60*24));
}

function checkReminder(){
  const dismissed=localStorage.getItem('spm_dismissed');
  const todayStr=new Date().toISOString().slice(0,10);
  if(dismissed && dismissed>=todayStr) return;

  const banner=document.getElementById('reminder-banner');
  const title=document.getElementById('reminder-title');
  const listEl=document.getElementById('reminder-list');
  const meta=document.getElementById('reminder-meta');

  // collect all sprints that have ended or are ending soon with open tasks
  const allSprints=[...new Set(tasks.map(t=>t.sprintKey).filter(Boolean))].sort();
  const problematic=[];

  allSprints.forEach(sk=>{
    const daysLeft=daysUntilSprintEnd(sk);
    const openTasks=tasks.filter(t=>t.sprintKey===sk && t.status!=='done');
    if(openTasks.length===0) return;
    // show if sprint ended or ending in <=2 days
    if(daysLeft<=2) problematic.push({sk, daysLeft, openTasks});
  });

  if(!problematic.length) return;

  const totalOpen=problematic.reduce((s,p)=>s+p.openTasks.length,0);
  const sprintCount=problematic.length;
  title.textContent=`⚠️ ${totalOpen} uncompleted task(s) across ${sprintCount} sprint(s)`;

  listEl.innerHTML='';
  problematic.forEach(({sk, daysLeft, openTasks})=>{
    const tag=weekTagFor(sk)||sprintLabel(sk);
    const endLabel=getSprintEndDate(sk).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
    const statusText=daysLeft<=0?'ended '+endLabel:daysLeft===1?'ends tomorrow':('ends '+endLabel);

    // week header row
    const hdr=document.createElement('li');
    hdr.style.cssText='font-weight:600;color:#5a1010;margin-top:8px;list-style:none;border-bottom:1px solid #f09595;padding-bottom:3px;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center';
    hdr.innerHTML=`<span style="display:flex;align-items:center;gap:6px"><span style="background:#791f1f;color:#fff;font-size:10px;padding:1px 7px;border-radius:99px">${tag}</span></span><span style="font-size:11px;font-weight:400;color:#a85a5a">${statusText}</span>`;
    listEl.appendChild(hdr);

    openTasks.forEach(t=>{
      const li=document.createElement('li');
      li.innerHTML=`${esc(t.text)}${t.assignee?` <span style="opacity:.7">(${esc(t.assignee)})</span>`:''}`;
      listEl.appendChild(li);
    });
  });

  meta.textContent='Click a task\'s status to mark it done and clear it from this list.';
  banner.classList.add('show');
}

function dismissReminder(){
  localStorage.setItem('spm_dismissed',new Date().toISOString().slice(0,10));
  document.getElementById('reminder-banner').classList.remove('show');
}

render();
checkReminder();
</script>
