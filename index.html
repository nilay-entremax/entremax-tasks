<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entremax Tech — Sprint Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#0f0f0e;
  --ink2:#4a4a48;
  --ink3:#9a9a97;
  --paper:#fafaf8;
  --paper2:#f2f1ee;
  --paper3:#e8e7e3;
  --border:#ddddd8;
  --done-bg:#eaf5e1;
  --done-text:#2a5c0e;
  --done-dot:#5db82e;
  --open-bg:#fff0e8;
  --open-text:#8a3200;
  --open-dot:#e85d04;
  --prog-bg:#e8f0ff;
  --prog-text:#1a3a8a;
  --prog-dot:#3b6bef;
  --yasin:#1a3a8a;
  --cemil:#0a5c3e;
  --ugur:#7a2e00;
  --accent:#e85d04;
  --radius:6px;
  --font:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
}

body{font-family:var(--font);background:var(--paper);color:var(--ink);min-height:100vh}

/* ── HEADER ── */
.site-header{background:var(--ink);color:#fff;padding:0 32px}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-size:15px;font-weight:600;letter-spacing:-.3px;color:#fff;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.header-meta{font-size:12px;color:rgba(255,255,255,.45);font-family:var(--mono)}

/* ── HERO ── */
.hero{background:var(--ink);color:#fff;padding:48px 32px 40px;border-bottom:1px solid rgba(255,255,255,.08)}
.hero-inner{max-width:1100px;margin:0 auto}
.hero h1{font-size:clamp(28px,5vw,44px);font-weight:700;letter-spacing:-.8px;line-height:1.1;margin-bottom:12px}
.hero h1 span{color:var(--accent)}
.hero p{font-size:15px;color:rgba(255,255,255,.55);max-width:520px;line-height:1.6}
.hero-stats{display:flex;gap:32px;margin-top:32px;padding-top:24px;border-top:1px solid rgba(255,255,255,.1)}
.stat-item{display:flex;flex-direction:column;gap:3px}
.stat-num{font-size:26px;font-weight:700;font-family:var(--mono)}
.stat-label{font-size:11px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.8px}

/* ── NAV ── */
.nav-wrap{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1100px;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px}
.nav-tabs{display:flex;gap:2px}
.nav-tab{padding:6px 16px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--ink3);border-radius:var(--radius);transition:all .15s;font-family:var(--font)}
.nav-tab:hover{color:var(--ink);background:var(--paper2)}
.nav-tab.active{color:var(--ink);background:var(--paper3);font-weight:600}
.person-pills{display:flex;gap:6px}
.person-pill{padding:4px 12px;font-size:12px;font-weight:500;border:1px solid var(--border);border-radius:99px;cursor:pointer;background:var(--paper);color:var(--ink2);transition:all .15s;font-family:var(--font)}
.person-pill:hover{border-color:var(--ink3)}
.person-pill.active-Y{background:#e6f1fb;color:var(--yasin);border-color:#b0cff5;font-weight:600}
.person-pill.active-C{background:#e1f5ee;color:var(--cemil);border-color:#8fd5b8;font-weight:600}
.person-pill.active-U{background:#faece7;color:var(--ugur);border-color:#f0b08a;font-weight:600}
.person-pill.active-all{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}

/* ── MAIN ── */
.main{max-width:1100px;margin:0 auto;padding:32px}
.section{display:none}.section.visible{display:block}

/* ── WEEK GRID ── */
.week-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.week-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:box-shadow .2s}
.week-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.06)}
.week-card.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wc-header{padding:12px 16px;background:var(--paper2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.wc-week{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink2);background:var(--paper3);padding:2px 7px;border-radius:4px}
.wc-dates{font-size:11px;color:var(--ink3)}
.wc-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.5px}
.badge-done{background:var(--done-bg);color:var(--done-text)}
.badge-current{background:var(--accent);color:#fff}
.badge-open{background:var(--open-bg);color:var(--open-text)}
.wc-body{padding:12px 16px}
.person-group{margin-bottom:10px}
.person-group:last-child{margin-bottom:0}
.pg-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.pg-label::after{content:'';flex:1;height:1px;background:var(--border)}
.pg-Y{color:var(--yasin)}
.pg-C{color:var(--cemil)}
.pg-U{color:var(--ugur)}
.task-row{display:flex;align-items:flex-start;gap:7px;padding:3px 0;border-bottom:1px solid var(--paper2)}
.task-row:last-child{border-bottom:none}
.task-dot{width:5px;height:5px;border-radius:50%;margin-top:5px;flex-shrink:0}
.dot-done{background:var(--done-dot)}
.dot-open{background:var(--open-dot)}
.dot-prog{background:var(--prog-dot)}
.task-text{font-size:12px;color:var(--ink2);line-height:1.4}
.task-text.is-done{color:var(--ink3);text-decoration:line-through}
.wc-footer{padding:8px 16px;background:var(--paper2);border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:11px;color:var(--ink3)}

/* ── MONTH VIEW ── */
.month-section{margin-bottom:40px}
.month-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.month-title{font-size:18px;font-weight:700;letter-spacing:-.3px}
.month-status{font-size:10px;font-weight:600;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.5px}
.month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.month-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.month-card.current-month{border-color:var(--accent)}
.mc-header{padding:10px 14px;background:var(--paper2);border-bottom:1px solid var(--border)}
.mc-person{font-size:11px;font-weight:600}
.mc-body{padding:10px 14px}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:60px 20px;color:var(--ink3);font-size:14px}

/* ── PROGRESS BAR ── */
.progress-wrap{margin-bottom:24px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 20px}
.progress-label{font-size:12px;color:var(--ink2);margin-bottom:8px;display:flex;justify-content:space-between}
.progress-bar{height:6px;background:var(--paper3);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--done-dot);border-radius:3px;transition:width .4s}
.progress-stats{display:flex;gap:20px;margin-top:10px}
.ps-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2)}
.ps-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── CURRENT SPRINT BANNER ── */
.current-banner{background:var(--ink);color:#fff;border-radius:10px;padding:18px 24px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.cb-left h2{font-size:16px;font-weight:600;margin-bottom:3px}
.cb-left p{font-size:12px;color:rgba(255,255,255,.5)}
.cb-right{display:flex;gap:20px}
.cb-stat{text-align:center}
.cb-num{font-size:22px;font-weight:700;font-family:var(--mono)}
.cb-lbl{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px}

/* ── FOOTER ── */
.site-footer{border-top:1px solid var(--border);padding:24px 32px;text-align:center;font-size:12px;color:var(--ink3);margin-top:48px}

/* ── EDITABLE TASKS ── */
.status-sel{padding:2px 7px;border:1px solid var(--border);border-radius:99px;font-size:10px;font-family:var(--font);cursor:pointer;outline:none;min-width:100px;margin-right:6px}
.s-done{background:var(--done-bg);color:var(--done-text);border-color:#97c459}
.s-not{background:var(--open-bg);color:var(--open-text);border-color:#f09595}
.s-prog{background:var(--prog-bg);color:var(--prog-text);border-color:#85b7eb}
.add-row{display:flex;gap:8px;margin:12px 0 4px}
.add-row input{flex:1;padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--paper);color:var(--ink);font-size:13px;font-family:var(--font);outline:none}
.add-row input::placeholder{color:var(--ink3)}
.add-btn{padding:7px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--paper);color:var(--ink);font-size:12px;cursor:pointer;font-family:var(--font);white-space:nowrap}
.add-btn:hover{background:var(--paper2)}
.wc-add{padding:10px 16px;border-top:1px solid var(--border);background:var(--paper2)}
</style>
</head>

const STATUSES=['not completed','in progress','done'];
const STATUS_KEY='db_statuses_v1';
let statuses={};
try{statuses=JSON.parse(localStorage.getItem(STATUS_KEY)||'{}');}catch(e){}
function saveStatuses(){try{localStorage.setItem(STATUS_KEY,JSON.stringify(statuses));}catch(e){}}

function taskId(wk,p,t){return wk+'||'+p+'||'+t;}
function getStatus(wk,p,t){return statuses[taskId(wk,p,t)]||(WEEK_DATES[wk]<CURRENT?'done':'not completed');}
function setTaskStatus(wk,p,t,s){statuses[taskId(wk,p,t)]=s;saveStatuses();render();}

function scls(s){return s==='done'?'s-done':s==='in progress'?'s-prog':'s-not';}

const PERSON_CLS={'Yasin':'pg-Y','Cemil':'pg-C','Ugur':'pg-U'};
let activeFilter='all';
let activeTab='weekly';

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function sprintLabel(key){
  const s=new Date(key+'T00:00:00'),e=new Date(key+'T00:00:00');
  e.setDate(e.getDate()+6);
  const f=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  return f(s)+' – '+f(e);
}

function isDone(sk){ return sk<CURRENT; }
function isCurrent(sk){ return sk===CURRENT; }

function buildWeeklyData(){
  const byWeek={};
  SLACK.forEach(({w,p,t})=>{
    if(!byWeek[w]) byWeek[w]={};
    if(!byWeek[w][p]) byWeek[w][p]=[];
    byWeek[w][p].push(...t);
  });
  return byWeek;
}

function renderWeekly(){
  const byWeek=buildWeeklyData();
  const container=document.getElementById('weekly');
  container.innerHTML='';

  // current sprint banner
  const curTasks=SLACK.filter(e=>WEEK_DATES[e.w]===CURRENT && (activeFilter==='all'||e.p===activeFilter));
  const curTotal=curTasks.reduce((s,e)=>s+e.t.length,0);
  const banner=document.createElement('div');
  banner.className='current-banner';
  banner.innerHTML=`
    <div class="cb-left">
      <h2>🟠 Current Sprint — W33</h2>
      <p>${sprintLabel(CURRENT)} &nbsp;·&nbsp; ${activeFilter==='all'?'All team members':activeFilter}</p>
    </div>
    <div class="cb-right">
      <div class="cb-stat"><div class="cb-num">${curTotal}</div><div class="cb-lbl">Tasks</div></div>
      <div class="cb-stat"><div class="cb-num">${curTasks.length}</div><div class="cb-lbl">Members</div></div>
    </div>`;
  container.appendChild(banner);

  // progress bar
  const allFiltered=SLACK.filter(e=>activeFilter==='all'||e.p===activeFilter);
  const totalT=allFiltered.reduce((s,e)=>s+e.t.length,0);
  const doneWeeks=Object.keys(WEEK_DATES).filter(w=>isDone(WEEK_DATES[w]));
  const doneT=allFiltered.filter(e=>doneWeeks.includes(e.w)).reduce((s,e)=>s+e.t.length,0);
  const pct=totalT?Math.round(doneT/totalT*100):0;

  const pw=document.createElement('div');
  pw.className='progress-wrap';
  pw.innerHTML=`
    <div class="progress-label"><span>Overall Sprint Progress</span><span><b>${pct}%</b> complete</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-stats">
      <div class="ps-item"><div class="ps-dot" style="background:var(--done-dot)"></div>${doneT} completed</div>
      <div class="ps-item"><div class="ps-dot" style="background:var(--open-dot)"></div>${totalT-doneT} remaining</div>
      <div class="ps-item"><div class="ps-dot" style="background:var(--ink3)"></div>${Object.keys(byWeek).length} sprints total</div>
    </div>`;
  container.appendChild(pw);

  // cards — most recent first
  const grid=document.createElement('div');
  grid.className='week-grid';

  const sortedWeeks=Object.keys(byWeek).sort((a,b)=>WEEK_DATES[b]>WEEK_DATES[a]?1:-1);
  sortedWeeks.forEach(wk=>{
    const sk=WEEK_DATES[wk]||'';
    const done=isDone(sk), curr=isCurrent(sk);

    // filter persons
    const persons=Object.keys(byWeek[wk]).filter(p=>activeFilter==='all'||p===activeFilter);
    if(!persons.length) return;

    const card=document.createElement('div');
    card.className='week-card'+(curr?' current':'');

    const badgeClass=done?'badge-done':curr?'badge-current':'badge-open';
    const badgeText=done?'Completed':curr?'Current':'Planned';

    let bodyHTML='';
    const ORDER=['Yasin','Cemil','Ugur'];
    const sortedPersons=[...ORDER.filter(p=>persons.includes(p)),...persons.filter(p=>!ORDER.includes(p))];
    let totalTasks=0;

    sortedPersons.forEach(p=>{
      const tasks=byWeek[wk][p];
      totalTasks+=tasks.length;
      bodyHTML+=`<div class="person-group">
        <div class="pg-label ${PERSON_CLS[p]||''}">${esc(p)}</div>
        ${tasks.map(t=>{
          const st=getStatus(wk,p,t);
          const dotCls=st==='done'?'dot-done':st==='in progress'?'dot-prog':'dot-open';
          return `<div class="task-row" style="align-items:center">
            <div class="task-dot ${dotCls}" style="margin-top:0;flex-shrink:0"></div>
            <select class="status-sel ${scls(st)}" onchange="setTaskStatus('${esc(wk)}','${esc(p)}','${esc(t)}',this.value)">
              ${STATUSES.map(s=>`<option value="${s}"${st===s?' selected':''}>${s}</option>`).join('')}
            </select>
            <div class="task-text${st==='done'?' is-done':''}">${esc(t)}</div>
          </div>`;
        }).join('')}
      </div>`;
    });

    card.innerHTML=`
      <div class="wc-header">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="wc-week">${wk}</span>
          <span class="wc-dates">${sprintLabel(sk)}</span>
        </div>
        <span class="wc-badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="wc-body">${bodyHTML}</div>
      <div class="wc-footer">
        <span>${sortedPersons.length} member${sortedPersons.length>1?'s':''}</span>
        <span>${totalTasks} tasks</span>
      </div>`;
    grid.appendChild(card);
  });
  container.appendChild(grid);
}

function renderMonthly(){
  const container=document.getElementById('monthly');
  container.innerHTML='';
  const CURRENT_MONTH='2026-07';

  MONTHLY_GOALS.slice().reverse().forEach(({m,label,entries})=>{
    const isDoneMonth=m<CURRENT_MONTH;
    const isCurrentMonth=m===CURRENT_MONTH;
    const filtered=entries.filter(e=>activeFilter==='all'||e.p===activeFilter);
    if(!filtered.length) return;

    const sec=document.createElement('div');
    sec.className='month-section';

    const badgeClass=isDoneMonth?'badge-done':isCurrentMonth?'badge-current':'badge-open';
    const badgeText=isDoneMonth?'Completed':isCurrentMonth?'Current Month':'Planned';

    sec.innerHTML=`<div class="month-header">
      <div class="month-title">${label}</div>
      <span class="wc-badge ${badgeClass}">${badgeText}</span>
    </div>`;

    const grid=document.createElement('div');
    grid.className='month-grid';

    const ORDER=['Yasin','Cemil','Ugur'];
    const sortedEntries=[...ORDER.filter(p=>filtered.find(e=>e.p===p)).map(p=>filtered.find(e=>e.p===p)),...filtered.filter(e=>!ORDER.includes(e.p))].filter(Boolean);

    sortedEntries.forEach(({p,t})=>{
      const card=document.createElement('div');
      card.className='month-card'+(isCurrentMonth?' current-month':'');
      card.innerHTML=`
        <div class="mc-header"><div class="mc-person ${PERSON_CLS[p]||''} pg-label" style="margin-bottom:0">${esc(p)}</div></div>
        <div class="mc-body">
          ${t.map(task=>{
            const gid='goal||'+m+'||'+p+'||'+task;
            const st=statuses[gid]||(isDoneMonth?'done':'not completed');
            return `<div class="task-row" style="align-items:center">
              <div class="task-dot ${st==='done'?'dot-done':st==='in progress'?'dot-prog':'dot-open'}" style="margin-top:0;flex-shrink:0"></div>
              <select class="status-sel ${scls(st)}" onchange="statuses['${gid}']=this.value;saveStatuses();renderMonthly()">
                ${STATUSES.map(s=>`<option value="${s}"${st===s?' selected':''}>${s}</option>`).join('')}
              </select>
              <div class="task-text${st==='done'?' is-done':''}">${esc(task)}</div>
            </div>`;
          }).join('')}
        </div>`;
      grid.appendChild(card);
    });

    sec.appendChild(grid);
    container.appendChild(sec);
  });
}

function render(){
  renderWeekly();
  renderMonthly();
  updateHeroStats();
}

function updateHeroStats(){
  const allFiltered=SLACK.filter(e=>activeFilter==='all'||e.p===activeFilter);
  const total=allFiltered.reduce((s,e)=>s+e.t.length,0);
  const doneWeeks=Object.keys(WEEK_DATES).filter(w=>isDone(WEEK_DATES[w]));
  const done=allFiltered.filter(e=>doneWeeks.includes(e.w)).reduce((s,e)=>s+e.t.length,0);
  const pct=total?Math.round(done/total*100):0;
  const totalGoals=MONTHLY_GOALS.reduce((s,m)=>s+m.entries.filter(e=>activeFilter==='all'||e.p===activeFilter).reduce((ss,e)=>ss+e.t.length,0),0);
  document.getElementById('hs-sprints').textContent=Object.keys(WEEK_DATES).length;
  document.getElementById('hs-tasks').textContent=total;
  document.getElementById('hs-goals').textContent=totalGoals;
  document.getElementById('hs-done').textContent=pct+'%';
}

function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll('.nav-tab').forEach((b,i)=>b.classList.toggle('active',['weekly','monthly'][i]===tab));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('visible'));
  document.getElementById(tab).classList.add('visible');
}

function setFilter(p){
  activeFilter=p;
  document.querySelectorAll('.person-pill').forEach(b=>{
    b.className='person-pill';
    if(b.textContent===p||(p==='all'&&b.textContent==='All')){
      b.className='person-pill active-'+(p==='all'?'all':p[0]);
    }
  });
  render();
}

// last updated
document.getElementById('last-updated').textContent='Updated '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

render();
